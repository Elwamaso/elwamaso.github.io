<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guillerclicker?</title>
  <link rel="stylesheet" href="alt2.css">
</head>
<body>
  <h1 id="counter">0 guillermos</h1>
  <img id="clickImg" class="clickable" src="src/clickeame!.jpg">

  <div class="btn-container" id="buttons">
    <button id="upgradeBtn">Más Guillerclicks (10 guillermos)</button>
    <button id="autoBtn">Guillerautomatización?????!! (1000 guillermos)</button>
    <button id="porqueBtn">Guillermo (1,000,000 guillermos)</button>
  </div>

  <div id="porqueLabel">Guillermo!</div>
  <div id="deathLabel">¿pEro qué has hecHo?</div>

  <img id="risingImg" src="src/memorial.png">

  <audio id="music" src="snds/thundersnaildelsoundtrackdeundertale.mp3"></audio>
  <audio id="sorrow" src="snds/sorrow.mp3"></audio>

  <script>
    let count = 0;
    let clickPower = 1;
    let upgradeCost = 10;
    let autoActive = false;
    let autoCost = 1000;
    let porqueActive = false;
    let porqueCost = 1000000;
    let firstClick = false;
    let gameOver = false;

    const counter = document.getElementById("counter");
    const clickImg = document.getElementById("clickImg");
    const upgradeBtn = document.getElementById("upgradeBtn");
    const autoBtn = document.getElementById("autoBtn");
    const porqueBtn = document.getElementById("porqueBtn");
    const porqueLabel = document.getElementById("porqueLabel");
    const deathLabel = document.getElementById("deathLabel");
    const buttons = document.getElementById("buttons");
    const music = document.getElementById("music");
    const sorrow = document.getElementById("sorrow");
    const risingImg = document.getElementById("risingImg");

    function updateCounter() {
      counter.textContent = `${count} guillermos`;

      upgradeBtn.disabled = count < upgradeCost || gameOver;
      autoBtn.disabled = count < autoCost || autoActive || gameOver;
      porqueBtn.disabled = count < porqueCost || porqueActive || gameOver;
    }

    clickImg.addEventListener("click", () => {
      if (gameOver) return;

      if (!firstClick) {
        document.title = "Guillerclicker!"
        firstClick = true;
        music.play();

        setTimeout(() => {
          endGame();
        }, 30000);
      }

      count += clickPower;
      updateCounter();

      clickImg.classList.add("pop");
      setTimeout(() => clickImg.classList.remove("pop"), 100);
    });

    upgradeBtn.addEventListener("click", () => {
      if (count >= upgradeCost) {
        count -= upgradeCost;
        clickPower *= 2;
        upgradeCost *= 2;
        upgradeBtn.textContent = `Más Guillerclicks (${upgradeCost} guillermos)`;
        updateCounter();
      }
    });

    autoBtn.addEventListener("click", () => {
      if (!autoActive && count >= autoCost) {
        count -= autoCost;
        autoActive = true;
        autoBtn.textContent = "¡Guillerautomatización!";
        updateCounter();
        setInterval(() => {
          if (!gameOver && autoActive) {
            count += clickPower;
            updateCounter();
          }
        }, 1000);
      }
    });

    porqueBtn.addEventListener("click", () => {
      if (!porqueActive && count >= porqueCost) {
        document.title="que";
        count -= porqueCost;
        porqueActive = true;
        porqueLabel.style.display = "block";
        updateCounter();
      }
    });

function endGame() {
  document.title="oh";
  gameOver = true;
  clickImg.src = "src/gore.jpg";
  clickImg.style.animation = "none";
  clickImg.style.cursor = "default";
  music.pause();
  music.currentTime = 0;

  setTimeout(() => {
    document.body.style.backgroundImage = 'url("src/s2.jpg")';
    document.body.style.backgroundRepeat = 'repeat';
    document.body.style.backgroundSize = 'auto';
    document.body.style.margin = '0';
    document.body.style.height = '100vh';
    document.body.style.display = 'flex';
    document.body.style.justifyContent = 'center';
    document.body.style.alignItems = 'center';
    document.body.style.color = 'white';
    document.body.style.backgroundColor = 'white';
    document.body.style.fontFamily = 'Arial, sans-serif';

    counter.style.display = "none";
    clickImg.style.display = "none";
    buttons.style.display = "none";
    porqueLabel.style.display = "none";
    deathLabel.style.display = "block";
    sorrow.play();

    document.title = "Eg";
    risingImg.style.opacity = "1";
    risingImg.style.animation = "riseUp 70s linear forwards";
  }, 2000);

  updateCounter();
}


    updateCounter();
  </script>
</body>

</html>
