<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real o Fake</title>
  <link rel="stylesheet" href="alt1.css">
</head>
<body>
  <h1 id="title">Real o Fake</h1>
  <img id="image" src="src/bodrio.jpg" alt="Imagen">
  <div class="btns">
    <button id="realBtn">Real</button>
    <button id="fakeBtn">Fake</button>
  </div>
  <audio id="dios" src="snds/etapasdeguillermodel1al10.mp3"></audio>
  <audio id="ushel" src="snds/ushel.mp3"></audio>
  <script>
    const title = document.getElementById("title");
    const image = document.getElementById("image");
    const realBtn = document.getElementById("realBtn");
    const fakeBtn = document.getElementById("fakeBtn");
    const dios = document.getElementById("dios");
    const ushel = document.getElementById("ushel");
    const body = document.body;
    const etapas = [
      { texto: "Real o Fake", img: "src/bodrio.jpg" },
      { texto: "¿Estás seguro?", img: "src/ssj1.png" },
      { texto: "¿Crees poder conmigo?", img: "src/ssj2.png" },
      { texto: "Mi poder ya supera tu comprensión", img: "src/ssj3(dios oscuro).png" },
      { texto: "Mírame bien... soy la perfección encarnada", img: "src/ssj3(reencarnado).png" },
      { texto: "El mundo debería inclinarse ante mí", img: "src/ssj4(supremo).png" },
      { texto: "Yo soy el final... y el principio", img: "src/ssjdiablo.png" },
      { texto: "hola", img: "src/god.png" }
    ];
    let index = 0;
    realBtn.addEventListener("click", () => {
      index++;
      if (index >= etapas.length) index = etapas.length - 1;
      dios.play();
      if (index === 3) {
        body.style.backgroundColor = "red";
      }
      if (index === 7) {
        window.location.href = "lostmedia.html";
      }

      image.style.opacity = 0;
      setTimeout(() => {
        document.title="";
        title.textContent = etapas[index].texto;
        image.src = etapas[index].img;
        image.style.opacity = 1;
      }, 10);
    });
fakeBtn.addEventListener("click", () => {
  body.innerHTML = "";
  body.style.backgroundColor = "white";
  body.style.color = "white";
  setTimeout(() => {
    const hola = document.createElement("div");
    hola.id = "hola";
    hola.classList.add("bub");
    hola.textContent = "No deberías estar aquí";
    body.appendChild(hola);
    setTimeout(() => {
      hola.style.opacity = 1;
    }, 100);
    ushel.play();
    ushel.volume=0.2;
    document.title = "Egg";
    body.style.backgroundImage = "url('src/s1.png')";
    body.style.backgroundRepeat = "repeat";
    body.style.backgroundSize = "auto";
  }, 5000);
});
  </script>
</body>
<!--No deberías estar aquí-->
</html>
