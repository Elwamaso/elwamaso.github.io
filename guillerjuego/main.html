<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <button id="btnGay">guillermo</button>
        <a href="pages/memorial.html">
            <img style="display:none; width: 500px;" id="exeImg" src="pages/src/bodrio.jpg">
        </a>
        <a href="pages/elojo.html">
            <img style="display:none; width: 300px;" id="godImg" src="pages/src/god.png">
        </a>
        <div id="imgContainer" style="display: none;">
            <img class="gim" id="gayImg" src="pages/src/vodrio.jpg">
            <div id="extraButtons" style="margin-top: 15px; display: none;">
                <button id="btnReal">Horripilante</button>
                <button id="btnFake">Hermoso</button>
            </div>
        </div>
    </div>
    <audio id="iugh" src="pages/snds/iugh.mp3"></audio>
    <audio id="yay" src="pages/snds/yayh!.mp3"></audio>
    <audio id="sorrow" src="pages/snds/sorrow.mp3"></audio>
    <audio id="riss" src="pages/snds/hord.mp3"></audio>
    <script>
        const btnGay = document.getElementById("btnGay");
        const imgContainer = document.getElementById("imgContainer");
        const extraButtons = document.getElementById("extraButtons");
        const btnReal = document.getElementById("btnReal");
        const btnFake = document.getElementById("btnFake");
        const gayImg = document.getElementById("gayImg");
        const exeImg = document.getElementById("exeImg");
        const godImg = document.getElementById("godImg");
        const iugh = document.getElementById("iugh");
        const yay = document.getElementById("yay");
        const sorrow = document.getElementById("sorrow");
        const riss = document.getElementById("riss");
        btnGay.addEventListener("click", () => {
        iugh.play();
        btnGay.style.display = "none";
        imgContainer.style.display = "block";
        extraButtons.style.display = "block";
        document.title="Guillermo?"
        });

        btnFake.addEventListener("click", () => {
        gayImg.style.display = "none";
        exeImg.style.display = "block";
        document.body.style.backgroundColor = "black";
        extraButtons.style.display = "none";
        document.title="no",
        riss.play();
        setTimeout(() => {
            window.location.href = "pages/baile.html";
        }, 5000);
        });
        btnReal.addEventListener("click", () => {
        yay.play();
        godImg.style.display = "block";
        gayImg.style.display = "none";
        extraButtons.style.display = "none";
        document.title="Real"

        const crearEstrella = () => {
            const star = document.createElement("div");
            star.classList.add("star");
            star.innerHTML = "★";
            star.style.left = Math.random() * 100 + "vw";
            star.style.fontSize = Math.random() * 20 + 5 + "px";
            star.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(star);

            setTimeout(() => {
            star.remove();
            }, 5000);
        };

        setInterval(crearEstrella, 20);
        });
</script>
</body>
</html>
